---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracegen
  namespace: grafana-tempo
---
# Token de larga duración para la SA (k8s >=1.24 ya no lo crea solo)
apiVersion: v1
kind: Secret
metadata:
  name: tracegen-token
  namespace: grafana-tempo
  annotations:
    kubernetes.io/service-account.name: tracegen
type: kubernetes.io/service-account-token
---
# Permite ESCRIBIR trazas en el tenant "prod" a través del gateway en modo openshift.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempostack-traces-write
rules:
  - apiGroups:
      - tempo.grafana.com
    resources:
      - prod
    resourceNames:
      - traces
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tempostack-traces-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempostack-traces-write
subjects:
  - kind: ServiceAccount
    name: tracegen
    namespace: grafana-tempo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tracegen
  namespace: grafana-tempo
spec:
  template:
    spec:
      serviceAccountName: tracegen
      restartPolicy: Never
      containers:
        - name: tracegen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: tracegen-token
                  key: token
          args:
            - traces
            - --otlp-http
            - --otlp-endpoint=tempo-simplest-gateway.grafana-tempo.svc:8080
            - --otlp-http-url-path=/api/traces/v1/prod/v1/traces
            - --otlp-insecure-skip-verify
            - --otlp-header=Authorization="Bearer $(TOKEN)"
            - --otlp-attributes=service.name="tracegen"
            - --traces=2000
            - --rate=10
            - --duration=60s
  backoffLimit: 4
